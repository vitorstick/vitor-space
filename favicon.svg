<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Solid Obsidian Background for Google Search SERP Contrast -->
    <linearGradient id="gBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a06" />
      <stop offset="50%" stop-color="#0a1009" />
      <stop offset="100%" stop-color="#0e170c" />
    </linearGradient>

    <!-- Vibrant Electric Lime (High Visibility on Google Search) -->
    <linearGradient id="gLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Cyan Accent for Depth -->
    <linearGradient id="gCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Topographical Contour Gradient -->
    <linearGradient id="gTopoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Beacon -->
    <radialGradient id="gBeacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a3e635" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <!-- High Contrast Neon Glow Filter for Google Icons -->
    <filter id="gSearchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Badge (Perfect for Google Search Circle/Square Crop) -->
  <rect width="512" height="512" rx="112" fill="url(#gBgGrad)" />

  <!-- Outer Tech Rim (Contrasts against light Google Search backgrounds) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gLimeGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Topographical Iso-Contour Lines -->
  <g fill="none" stroke="url(#gTopoGrad)" stroke-linecap="round">
    <path d="M 48 150 Q 180 90, 320 140 T 464 160" stroke-width="5" />
    <path d="M 48 230 Q 200 170, 340 220 T 464 240" stroke-width="6" />
    <path d="M 48 310 Q 170 260, 300 300 T 464 320" stroke-width="4.5" opacity="0.7" />
  </g>

  <!-- Main Topographical "V" Monogram Crest -->
  <!-- Left Wing -->
  <path d="M 104 120 L 256 410 L 256 265 L 180 120 Z" 
        fill="url(#gLimeGrad)" filter="url(#gSearchGlow)" />

  <!-- Right Wing (Faceted 3D Surface) -->
  <path d="M 408 120 L 256 410 L 256 265 L 332 120 Z" 
        fill="url(#gCyanGrad)" filter="url(#gSearchGlow)" />

  <!-- Inner Topo Elevation Ridge Inset Line -->
  <path d="M 148 142 L 256 345 L 364 142" 
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- Waypoint Radar Beacon Apex Node (Google SERP Eye-Catcher) -->
  <circle cx="256" cy="410" r="30" fill="url(#gBeacon)" filter="url(#gSearchGlow)" />
  <circle cx="256" cy="410" r="12" fill="#ffffff" />
  <circle cx="256" cy="410" r="5" fill="#060a06" />

  <!-- Terminal Nodes -->
  <circle cx="104" cy="120" r="7" fill="#ccff00" />
  <circle cx="408" cy="120" r="7" fill="#22d3ee" />
</svg>