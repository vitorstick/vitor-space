<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050805" />
      <stop offset="50%" stop-color="#090e08" />
      <stop offset="100%" stop-color="#0e170c" />
    </linearGradient>

    <!-- Neon Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Topo Line Gradient -->
    <linearGradient id="topoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Beacon Glow -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#a3e635" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <!-- Base Badge Container (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Ambient Glow Behind Emblem -->
  <circle cx="256" cy="240" r="180" fill="url(#centerGlow)" />

  <!-- Outer Tech Border with Corner Accents -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#limeGrad)" stroke-width="3" stroke-opacity="0.35" />
  
  <!-- Corner HUD Reticles -->
  <path d="M 44 64 L 44 44 L 64 44" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 468 64 L 468 44 L 448 44" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 44 448 L 44 468 L 64 468" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 468 448 L 468 468 L 448 468" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Topographical Iso-Contour Lines (Background Layer) -->
  <g fill="none" stroke="url(#topoGrad)" stroke-linecap="round">
    <!-- Contour 1 (Outer Elevation Wave) -->
    <path d="M 60 160 C 140 120, 220 180, 310 140 C 380 110, 430 150, 452 170" stroke-width="2.5" />
    
    <!-- Contour 2 -->
    <path d="M 50 230 C 130 190, 210 260, 320 200 C 400 160, 440 210, 462 230" stroke-width="3" />
    
    <!-- Contour 3 (Mid Peak Line) -->
    <path d="M 52 300 C 120 270, 190 320, 290 270 C 370 230, 420 280, 460 290" stroke-width="2.5" />
    
    <!-- Contour 4 (Lower Valleys) -->
    <path d="M 60 370 C 150 330, 240 400, 340 330 C 410 290, 440 350, 452 370" stroke-width="2" />
  </g>

  <!-- Topo Height Grid Dots -->
  <g fill="#a3e635" opacity="0.25">
    <circle cx="100" cy="100" r="3" />
    <circle cx="140" cy="100" r="3" />
    <circle cx="370" cy="100" r="3" />
    <circle cx="410" cy="100" r="3" />
    <circle cx="100" cy="410" r="3" />
    <circle cx="410" cy="410" r="3" />
  </g>

  <!-- Primary Topographical "V" Emblem Layer -->
  
  <!-- Outer Glow Shadow of the V Monogram -->
  <path d="M 120 130 L 256 390 L 392 130 L 324 130 L 256 265 L 188 130 Z" 
        fill="url(#limeGrad)" filter="url(#softGlow)" opacity="0.6" />

  <!-- Inner Concentric Topo Ridge Lines inside the V -->
  <path d="M 152 145 L 256 350 L 360 145" 
        fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 6" opacity="0.7" />

  <path d="M 176 160 L 256 320 L 336 160" 
        fill="none" stroke="#a3e635" stroke-width="2" opacity="0.5" />

  <!-- Main Geometric "V" Telemetry Monogram -->
  <path d="M 112 120 L 256 400 L 400 120 L 330 120 L 256 260 L 182 120 Z" 
        fill="url(#limeGrad)" filter="url(#neonGlow)" />

  <!-- Accent Chamfer / Facet Line on Right Arm for 3D Depth -->
  <path d="M 256 400 L 400 120 L 330 120 L 256 260 Z" 
        fill="url(#accentGrad)" opacity="0.35" />

  <!-- Active Telemetry Waypoint Radar Beacon (Apex Node) -->
  <!-- Outer Beacon Ring -->
  <circle cx="256" cy="400" r="36" fill="url(#beaconGlow)" />
  <circle cx="256" cy="400" r="18" fill="none" stroke="#bef264" stroke-width="3.5" filter="url(#neonGlow)" />
  <circle cx="256" cy="400" r="7" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Crosshair Reticle lines around Beacon Node -->
  <line x1="256" y1="368" x2="256" y2="378" stroke="#bef264" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="432" stroke="#bef264" stroke-width="3" stroke-linecap="round" />
  <line x1="224" y1="400" x2="234" y2="400" stroke="#bef264" stroke-width="3" stroke-linecap="round" />
  <line x1="278" y1="400" x2="288" y2="400" stroke="#bef264" stroke-width="3" stroke-linecap="round" />

  <!-- Top Telemetry Pulse Nodes on V Wings -->
  <circle cx="112" cy="120" r="6" fill="#a3e635" />
  <circle cx="400" cy="120" r="6" fill="#22d3ee" />
</svg>